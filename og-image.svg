    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="40%" stop-color="#0D1F2D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1F2D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
